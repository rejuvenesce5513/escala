<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escala 5x2 · Clínica Rejuvenesce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#14232B; --ink-2:#4B5D64; --line:#D5DEDC;
  --brand:#0E5E57; --brand-ink:#FFFFFF; --brand-soft:#D7ECE8;
  --off:#E3E8E7; --off-ink:#7A8A8F; --warn:#B07A0C; --warn-soft:#F7EBCB; --bad:#B23B2C; --bad-soft:#F6DCD7;
  --bar:#0E5E57; --bar-comp:#3BA393; --bar-sat:#6C8FB0;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F171A; --surface:#172226; --surface-2:#1D2A2F; --ink:#E4ECEB; --ink-2:#9AAEB1; --line:#2B3B40;
    --brand:#4FB9A9; --brand-ink:#0B1A18; --brand-soft:#173B37;
    --off:#22302F; --off-ink:#7E9196; --warn:#E2B04A; --warn-soft:#3A2F14; --bad:#EE7C6B; --bad-soft:#3E1F1A;
    --bar:#4FB9A9; --bar-comp:#8BD8CB; --bar-sat:#8FB2D3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171A; --surface:#172226; --surface-2:#1D2A2F; --ink:#E4ECEB; --ink-2:#9AAEB1; --line:#2B3B40;
  --brand:#4FB9A9; --brand-ink:#0B1A18; --brand-soft:#173B37;
  --off:#22302F; --off-ink:#7E9196; --warn:#E2B04A; --warn-soft:#3A2F14; --bad:#EE7C6B; --bad-soft:#3E1F1A;
  --bar:#4FB9A9; --bar-comp:#8BD8CB; --bar-sat:#8FB2D3;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.titlebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.titlebar h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.titlebar .sub{color:var(--ink-2);font-size:.85rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:10px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
select,input[type=text],input[type=time],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px}
.filters select{min-width:150px}

.days{display:grid;grid-template-columns:repeat(7,minmax(74px,1fr));gap:6px;padding-bottom:12px;overflow-x:auto}
.day{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:74px}
.day .d{font-size:.78rem;color:var(--ink-2);font-weight:600}
